  <a class="marka" href="/"><img src="/selware-96.png" alt="" width="36" height="36">Selware</a>
  <nav aria-label="Ana sayfa"><a href="/#uygulamalar" class="gorunmez-dar">Uygulamalar</a><a href="/hakkimda/" aria-current="page">Hakkımda</a><a class="dil" href="/en/cv/" hreflang="en" lang="en" title="English">EN</a></nav>
</div></header>
<main id="icerik">

<div class="kap cv-kap">
  <div class="cv-bar">
    <a class="cv-geri" href="/hakkimda/">← Hakkımda</a>
    <div class="cv-dil" role="tablist" aria-label="Özgeçmiş">
      <button type="button" role="tab" data-dosya="Onur_Sel_CV_Turkce.pdf" aria-selected="true">Türkçe</button>
      <button type="button" role="tab" data-dosya="Onur_Sel_CV_English.pdf" aria-selected="false">English</button>
    </div>
    <span class="cv-sag">
      <a class="dugme ince" id="cv-ac" href="/cv/Onur_Sel_CV_Turkce.pdf" target="_blank" rel="noopener">PDF&#x27;i yeni sekmede aç</a>
      <a class="dugme koyu" id="cv-indir" href="/cv/Onur_Sel_CV_Turkce.pdf" download>CV&#x27;yi indir</a>
    </span>
  </div>
  <object id="cv-pdf" class="cv-pdf" data="/cv/Onur_Sel_CV_Turkce.pdf#toolbar=0&navpanes=0" type="application/pdf" aria-label="Özgeçmiş">
    <p>Tarayıcın PDF&#x27;i sayfada göstermiyor. <a href="/cv/Onur_Sel_CV_Turkce.pdf">PDF</a></p>
  </object>
</div>
<script>
(function(){
  var sek=document.querySelectorAll('.cv-dil button'),obj=document.getElementById('cv-pdf'),
      ind=document.getElementById('cv-indir'),ac=document.getElementById('cv-ac');
  function sec(d){
    var u='/cv/'+d;
    obj.setAttribute('data',u+'#toolbar=0&navpanes=0');
    var k=obj.cloneNode(true);k.setAttribute('data',u+'#toolbar=0&navpanes=0');obj.parentNode.replaceChild(k,obj);obj=k;
    ind.href=u;ac.href=u;
    sek.forEach(function(b){b.setAttribute('aria-selected',b.getAttribute('data-dosya')===d?'true':'false');});
  }
  sek.forEach(function(b){b.addEventListener('click',function(){sec(b.getAttribute('data-dosya'));});});
})();
</script>
